[project]
name = "entirius-py-idx-normalizator"
version = "2.0.0"
description = "Identifier (idx/SKU/EAN) normalizer and validator"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "python-slugify>=8.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/entirius/entirius-py-idx-normalizator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idx_normalizator"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# S101: normalize_* guard non-null preconditions with assert (pre-2.0 contract, kept 1:1).
"src/idx_normalizator/idx_normalizator.py" = ["S101"]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["idx_normalizator"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
